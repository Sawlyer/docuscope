services:
  api:
    build: ./backend
    ports: ["${DOCUSCOPE_API_PORT:-18080}:8000"]
    environment:
      MOCK_LLM: "false"
      LM_STUDIO_URL: "http://host.docker.internal:1234/api/v1/chat"
      LM_STUDIO_MODEL: "minicpm5-1b"
      DATABASE_URL: "postgresql+psycopg://docuscope:docuscope@postgres:5432/docuscope"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "docuscope"
      MINIO_SECRET_KEY: "docuscope-local"
      MINIO_BUCKET: "docuscope-documents"
      EMBEDDING_MODEL: "intfloat/multilingual-e5-small"
      EMBEDDING_CACHE_DIR: "/models"
      SESSION_COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: "http://localhost:${DOCUSCOPE_WEB_PORT:-18000}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - model_cache:/models
      - ./evaluation:/evaluation:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["${DOCUSCOPE_WEB_PORT:-18000}:80"]
    depends_on: [api]
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docuscope
      POSTGRES_USER: docuscope
      POSTGRES_PASSWORD: docuscope
    ports: ["${DOCUSCOPE_DB_PORT:-15432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuscope -d docuscope"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: docuscope
      MINIO_ROOT_PASSWORD: docuscope-local
    ports: ["${DOCUSCOPE_STORAGE_PORT:-19000}:9000","${DOCUSCOPE_CONSOLE_PORT:-19001}:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  minio_data:
  model_cache:
